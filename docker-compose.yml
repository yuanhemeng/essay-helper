services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scholarflow
      POSTGRES_USER: scholarflow
      POSTGRES_PASSWORD: scholarflow
    ports:
      - "5432:5432"
    volumes:
      - scholarflow-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scholarflow
      MINIO_ROOT_PASSWORD: scholarflow-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - scholarflow-minio:/data

volumes:
  scholarflow-postgres:
  scholarflow-minio:
